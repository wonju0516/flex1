<svg width="1440" height="1024" viewBox="0 0 1440 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1440" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#080D1B" />
      <stop offset="1" stop-color="#151B2D" />
    </linearGradient>
    <linearGradient id="heroGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F43F5E" />
      <stop offset="1" stop-color="#F97316" />
    </linearGradient>
    <linearGradient id="buttonGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F97316" />
      <stop offset="1" stop-color="#FACC15" />
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feFlood flood-opacity="0" result="BackgroundImageFix"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="18" result="shadowBlur"/>
      <feOffset dy="30"/>
      <feComposite in2="shadowBlur" operator="out"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.05 0 0 0 0 0.06 0 0 0 0 0.12 0 0 0 0.55 0"/>
      <feBlend in="SourceGraphic" mode="normal"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="60" result="glowBlur"/>
      <feBlend in="SourceGraphic" in2="glowBlur" mode="screen"/>
    </filter>
    <style>
      text {
        font-family: 'Inter', 'Pretendard', 'Noto Sans KR', sans-serif;
        fill: #F8FAFC;
      }
      .eyebrow {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        fill: rgba(248, 250, 252, 0.7);
      }
      .heading-xl {
        font-size: 44px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .body {
        font-size: 16px;
        font-weight: 400;
        fill: #CBD5F5;
      }
      .label {
        font-size: 13px;
        font-weight: 500;
        fill: #E2E8F0;
      }
      .field-label {
        font-size: 13px;
        font-weight: 600;
        fill: #94A3B8;
        letter-spacing: 0.04em;
      }
    </style>
  </defs>
  <rect width="1440" height="1024" fill="url(#bgGradient)" />

  <!-- Ambient orbs -->
  <circle cx="220" cy="190" r="160" fill="#F43F5E" opacity="0.16" />
  <circle cx="1240" cy="180" r="200" fill="#38BDF8" opacity="0.08" />
  <circle cx="1180" cy="840" r="260" fill="#F97316" opacity="0.08" />

  <!-- Top navigation helper -->
  <g opacity="0.7">
    <text x="120" y="120" font-size="26" font-weight="700" fill="#F43F5E">CGV</text>
    <text x="220" y="118" class="body" fill="#94A3B8">로그인</text>
    <text x="288" y="118" class="body" fill="rgba(148, 163, 184, 0.6)">멤버십</text>
    <text x="374" y="118" class="body" fill="rgba(148, 163, 184, 0.6)">고객센터</text>
  </g>

  <!-- Main auth card -->
  <g filter="url(#cardShadow)">
    <rect x="160" y="168" width="1120" height="688" rx="40" fill="rgba(15, 23, 42, 0.82)" stroke="rgba(148, 163, 184, 0.12)" stroke-width="1" />
  </g>

  <!-- Hero side -->
  <g filter="url(#glow)">
    <rect x="160" y="168" width="520" height="688" rx="40" fill="url(#heroGradient)" />
  </g>
  <g transform="translate(220 252)">
    <text class="eyebrow">WELCOME BACK</text>
    <text y="74" class="heading-xl">다시 만난 CGV</text>
    <text y="116" class="body" fill="#FFE4E6">나만의 상영관, 프리미엄 좌석, 멤버십 혜택을 한 번에.</text>
    <g transform="translate(0 200)">
      <rect width="192" height="72" rx="20" fill="rgba(15, 23, 42, 0.2)" stroke="rgba(248, 250, 252, 0.18)" />
      <text x="24" y="32" class="label" fill="#FFE4E6">이번 주 IMAX 프리뷰</text>
      <text x="24" y="54" class="body" fill="#FFE4E6">용산 · 4DX 얼리버드</text>
      <rect x="208" width="192" height="72" rx="20" fill="rgba(15, 23, 42, 0.18)" stroke="rgba(248, 250, 252, 0.1)" />
      <text x="232" y="32" class="label" fill="#FFE4E6">VIP 시그니처</text>
      <text x="232" y="54" class="body" fill="#FFE4E6">씨네 드 쉐프 라운지</text>
    </g>
    <g transform="translate(0 328)">
      <text class="body" fill="#FFE4E6">CGV ID 하나로 4DX, ScreenX, IMAX까지 빠르게 경험하세요.</text>
    </g>
  </g>

  <!-- Auth form -->
  <g transform="translate(740 244)">
    <text class="eyebrow" fill="#FBBF24">Sign in</text>
    <text y="64" class="heading-xl">CGV 계정 로그인</text>
    <text y="100" class="body">멤버십 포인트, 예매 내역을 안전하게 관리하세요.</text>

    <!-- Email field -->
    <g transform="translate(0 144)">
      <text class="field-label">이메일</text>
      <rect y="20" width="420" height="60" rx="16" fill="rgba(30, 41, 59, 0.8)" stroke="rgba(148, 163, 184, 0.24)" />
      <text x="24" y="58" class="label" fill="#F8FAFC">you@example.com</text>
    </g>

    <!-- Password field -->
    <g transform="translate(0 232)">
      <text class="field-label">비밀번호</text>
      <rect y="20" width="420" height="60" rx="16" fill="rgba(30, 41, 59, 0.8)" stroke="rgba(148, 163, 184, 0.24)" />
      <text x="24" y="58" class="label" fill="#F8FAFC">••••••••••</text>
      <text x="340" y="58" class="label" fill="#F97316">보기</text>
    </g>

    <!-- Remember + Forgot -->
    <g transform="translate(0 324)">
      <rect width="18" height="18" rx="6" fill="rgba(248, 113, 113, 0.2)" stroke="#F87171" stroke-width="2" />
      <rect x="4" y="6" width="10" height="6" rx="3" fill="#F87171" />
      <text x="32" y="16" class="label">자동 로그인</text>
      <text x="300" y="16" class="label" fill="#F97316">비밀번호 찾기</text>
    </g>

    <!-- Primary button -->
    <g transform="translate(0 360)">
      <rect width="420" height="64" rx="18" fill="url(#buttonGradient)" />
      <text x="132" y="40" font-size="18" font-weight="700">로그인하고 예매하기</text>
    </g>

    <!-- Divider -->
    <g transform="translate(0 442)">
      <line x1="0" y1="0" x2="180" y2="0" stroke="rgba(148, 163, 184, 0.2)" stroke-width="1" />
      <text x="196" y="6" class="label" fill="#94A3B8">또는</text>
      <line x1="240" y1="0" x2="420" y2="0" stroke="rgba(148, 163, 184, 0.2)" stroke-width="1" />
    </g>

    <!-- Social buttons -->
    <g transform="translate(0 470)">
      <rect width="200" height="56" rx="16" fill="rgba(30, 41, 59, 0.75)" stroke="rgba(148, 163, 184, 0.2)" />
      <text x="60" y="34" class="label">Kakao로 계속하기</text>
      <rect x="220" width="200" height="56" rx="16" fill="rgba(30, 41, 59, 0.75)" stroke="rgba(148, 163, 184, 0.2)" />
      <text x="280" y="34" class="label">Apple로 계속하기</text>
    </g>

    <!-- Sign up prompt -->
    <g transform="translate(0 548)">
      <text class="body" fill="#94A3B8">계정이 없으신가요?</text>
      <text x="176" class="label" fill="#F97316">지금 회원가입</text>
    </g>
  </g>

  <!-- Bottom helper strip -->
  <g opacity="0.7">
    <text x="160" y="900" class="body">© 2025 CJ CGV. All rights reserved.</text>
    <text x="420" y="900" class="body" fill="#94A3B8">이용약관</text>
    <text x="520" y="900" class="body" fill="#94A3B8">개인정보 처리방침</text>
    <text x="680" y="900" class="body" fill="#94A3B8">고객센터 1544-1122</text>
  </g>
</svg>
